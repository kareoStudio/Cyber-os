name: Build Cyber OS APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Generate Android Icons from www/icon/icon.png
        run: |
          ICON_SRC="www/icon/icon.png"
          if [ -f "$ICON_SRC" ]; then
            echo "Icon found at $ICON_SRC"
            mkdir -p android-custom/res/mipmap-mdpi
            mkdir -p android-custom/res/mipmap-hdpi
            mkdir -p android-custom/res/mipmap-xhdpi
            mkdir -p android-custom/res/mipmap-xxhdpi
            mkdir -p android-custom/res/mipmap-xxxhdpi
            mkdir -p android-custom/res/mipmap-anydpi-v26

            # Generate all sizes
            convert "$ICON_SRC" -resize 48x48! android-custom/res/mipmap-mdpi/ic_launcher.png
            convert "$ICON_SRC" -resize 72x72! android-custom/res/mipmap-hdpi/ic_launcher.png
            convert "$ICON_SRC" -resize 96x96! android-custom/res/mipmap-xhdpi/ic_launcher.png
            convert "$ICON_SRC" -resize 144x144! android-custom/res/mipmap-xxhdpi/ic_launcher.png
            convert "$ICON_SRC" -resize 192x192! android-custom/res/mipmap-xxxhdpi/ic_launcher.png

            # Generate foreground for adaptive icon
            convert "$ICON_SRC" -resize 108x108! android-custom/res/mipmap-mdpi/ic_launcher_foreground.png
            convert "$ICON_SRC" -resize 162x162! android-custom/res/mipmap-hdpi/ic_launcher_foreground.png
            convert "$ICON_SRC" -resize 216x216! android-custom/res/mipmap-xhdpi/ic_launcher_foreground.png
            convert "$ICON_SRC" -resize 324x324! android-custom/res/mipmap-xxhdpi/ic_launcher_foreground.png
            convert "$ICON_SRC" -resize 432x432! android-custom/res/mipmap-xxxhdpi/ic_launcher_foreground.png

            # Generate black background
            convert -size 108x108 xc:black android-custom/res/mipmap-mdpi/ic_launcher_background.png
            convert -size 162x162 xc:black android-custom/res/mipmap-hdpi/ic_launcher_background.png
            convert -size 216x216 xc:black android-custom/res/mipmap-xhdpi/ic_launcher_background.png
            convert -size 324x324 xc:black android-custom/res/mipmap-xxhdpi/ic_launcher_background.png
            convert -size 432x432 xc:black android-custom/res/mipmap-xxxhdpi/ic_launcher_background.png

            # Create adaptive icon XML
            echo '<?xml version="1.0" encoding="utf-8"?>' > android-custom/res/mipmap-anydpi-v26/ic_launcher.xml
            echo '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">' >> android-custom/res/mipmap-anydpi-v26/ic_launcher.xml
            echo '    <background android:drawable="@mipmap/ic_launcher_background"/>' >> android-custom/res/mipmap-anydpi-v26/ic_launcher.xml
            echo '    <foreground android:drawable="@mipmap/ic_launcher_foreground"/>' >> android-custom/res/mipmap-anydpi-v26/ic_launcher.xml
            echo '</adaptive-icon>' >> android-custom/res/mipmap-anydpi-v26/ic_launcher.xml

            echo "Icons generated successfully"
          else
            echo "Icon not found at $ICON_SRC - using default Android icon"
          fi

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Copy custom Android files
        run: |
          cp android-custom/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/java/com/kareostudio
          cp android-custom/res/java/com/kareostudio/*.java android/app/src/main/java/com/kareostudio/
          mkdir -p android/app/src/main/res/values
          cp android-custom/res/values/strings.xml android/app/src/main/res/values/strings.xml
          if [ -d "android-custom/res/mipmap-mdpi" ]; then
            cp -r android-custom/res/mipmap-* android/app/src/main/res/
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Grant execute permission
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cyber-os-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
