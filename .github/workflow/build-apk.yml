name: Build Cyber OS APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Add Android platform
        run: npx cap add android

      - name: Copy custom Android files
        run: |
          # Copy AndroidManifest.xml
          cp android-custom/AndroidManifest.xml android/app/src/main/AndroidManifest.xml

          # Create Java package directory
          mkdir -p android/app/src/main/java/com/kareostudio

          # Copy all Java plugin files
          cp android-custom/java/com/kareostudio/*.java android/app/src/main/java/com/kareostudio/

          # Copy strings.xml
          mkdir -p android/app/src/main/res/values
          cp android-custom/res/values/strings.xml android/app/src/main/res/values/strings.xml

          # Copy icons if exist
          if [ -d "android-custom/res/mipmap-mdpi" ]; then
            cp -r android-custom/res/mipmap-* android/app/src/main/res/
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Grant execute permission
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cyber-os-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
